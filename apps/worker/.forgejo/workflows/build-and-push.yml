name: Build and Push

on:
  push:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.DK_USER }}
          password: ${{ secrets.DK_ACCESS_TOKEN }}

      - name: Generate image tag
        id: meta
        run: |
          DATE=$(date +'%y_%m_%d')
          RAND=$(printf '%05d' "$((RANDOM % 100000))")
          echo "TAG=${DATE}_${RAND}" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          tags: |
            ${{ secrets.REGISTRY }}/${{ github.repository }}:latest
            ${{ secrets.REGISTRY }}/${{ github.repository }}:${{ steps.meta.outputs.TAG }}
