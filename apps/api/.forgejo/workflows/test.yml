name: Unit Tests

on:
  push:
    branches:
      - "**"
      - "!main"
      - "!development"

permissions:
  id-token: write
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Infisical CLI
        run: npm install -g @infisical/cli

      - name: Fetch secrets
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_API_URL: https://inf.aurostack.co
        run: yarn secrets -e test

      - name: Generate Prisma client
        run: yarn test:db:generate

      - name: Run unit tests
        run: yarn test

      - name: Build
        run: yarn build