# Builds and pushes every backend image from the monorepo root.
#
# The API and the worker share one Prisma client (@qotm/db), so they are always
# built together under one tag: `qotm-api:<tag>` and `qotm-worker:<tag>` are
# guaranteed to come from the same commit and the same schema. Deploy them as a
# set, running `qotm-api-migrate:<tag>` once first.

name: Build and Push

on:
  push:
    branches:
      - main
  # Lets a build be cut from any branch without merging to main first.
  workflow_dispatch:

jobs:
  # One tag for the whole set, generated once and shared by every matrix leg —
  # otherwise each image would get its own random tag.
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}
      owner: ${{ steps.tag.outputs.OWNER }}
    steps:
      - name: Generate image tag
        id: tag
        run: |
          DATE=$(date +'%y_%m_%d')
          RAND=$(printf '%05d' "$((RANDOM % 100000))")
          echo "TAG=${DATE}_${RAND}" >> "$GITHUB_OUTPUT"
          # From `github.repository` rather than `github.repository_owner`, which
          # Forgejo may not populate.
          echo "OWNER=$(echo '${{ github.repository }}' | cut -d/ -f1)" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: meta
    strategy:
      # Report every image's result rather than cancelling siblings on the first
      # failure. Note this means a partial set can be pushed — re-run the job.
      fail-fast: false
      matrix:
        include:
          - image: qotm-api
            dockerfile: apps/api/Dockerfile
            target: ''
          - image: qotm-api-migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
          - image: qotm-worker
            dockerfile: apps/worker/Dockerfile
            target: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.DK_USER }}
          password: ${{ secrets.DK_ACCESS_TOKEN }}

      - name: Build and Push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          push: true
          # The backend root: every image needs packages/db as well as its app.
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          tags: |
            ${{ secrets.REGISTRY }}/${{ needs.meta.outputs.owner }}/${{ matrix.image }}:latest
            ${{ secrets.REGISTRY }}/${{ needs.meta.outputs.owner }}/${{ matrix.image }}:${{ needs.meta.outputs.tag }}

      - name: Summary
        run: |
          echo "Pushed ${{ matrix.image }}:${{ needs.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
